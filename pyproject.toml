[project]
name = "tensor-disentanglement-code"
version = "0.1.0"
description = "Master/Novice divergence as a dense credit signal for RL with verifiable rewards"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "torch>=2.11.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
    "datasets",
    "huggingface-hub",
    "gymnasium",
    "lm-eval>=0.4.12",
    "ipywidgets>=8.1.8",
    "flash-linear-attention>=0.5.0",
    "accelerate>=1.14.0",
    "causal-conv1d>=1.6.2.post1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
